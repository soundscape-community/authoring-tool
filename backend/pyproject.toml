# Copyright (c) Soundscape Community Contributors.
[project]
name = "backend"
version = "0.1.0"
description = "Django REST API backend for the Soundscape Authoring Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "dj-rest-auth>=7.0.1",
    "django>=5.2.18,<5.3",
    "django-cors-headers>=4.7.0",
    "djangorestframework>=3.18.2",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=21.2.0",
    "gpxpy>=1.6.2",
    "markdown>=3.8.2",
    "pillow>=13.0.0",
    "psycopg2>=2.9.10",
    "pygments>=2.20.0",
    "pytz>=2025.2",
    "requests>=2.33.0",
    "whitenoise>=6.9.0",
    "django-health-check>=3.20.0",
    "django-allauth[socialaccount]>=65.20.1",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "ruff>=0.15.2",
]

[tool.uv]
# Security floors for transitive dependencies used by HTTP and authentication.
constraint-dependencies = [
    "certifi>=2026.10.19",
    "oauthlib>=4.0.0",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
# Override gpxpy to use a fork that escapes xml charactors correctly. 
# see https://github.com/tkrajina/gpxpy/pull/282
# The PR has been merged but not released yet.
gpxpy = { git = "https://github.com/RDMurray/gpxpy", rev = "escape" }

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S106"]
"backend/settings/*.py" = ["F403", "F405"]
